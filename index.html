<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽籤機｜LinkedIn 互評</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.1/firebase-firestore-compat.js"></script>
<style>
:root{
    --green:#33FF9C;
    --green-dim: rgba(51,255,156,0.55);
    --red:#FF4C4C;
    --purple:#C77DFF;
    --panel-bg: rgba(4,10,8,0.92);
    --ink-light:#F2FFF8;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#020403;
    color: var(--ink-light);
    font-family: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, "Microsoft JhengHei", "PingFang TC", monospace;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ---------- background: large, bold, fast-scrolling roster columns ---------- */
  .bg-scroll{ position: fixed; inset: 0; z-index: 0; display: flex; overflow: hidden; background: #020403; }
  .bg-col{ flex: 1; position: relative; overflow: hidden; border-right: 1px solid rgba(51,255,156,0.1); }
  .bg-col:last-child{ border-right: none; }
  .bg-col-inner{
    position: absolute; top: 0; left: 0; width: 100%;
    display: flex; flex-direction: column;
    animation: scrollUp linear infinite;
    will-change: transform, filter;
    transition: filter 0.15s linear;
  }
  @keyframes scrollUp{ from{ transform: translateY(0); } to{ transform: translateY(-50%); } }
  .bg-col:nth-child(10n+1) .bg-col-inner{ animation-duration: 26s; }
  .bg-col:nth-child(10n+2) .bg-col-inner{ animation-duration: 19s; animation-direction: reverse; }
  .bg-col:nth-child(10n+3) .bg-col-inner{ animation-duration: 31s; }
  .bg-col:nth-child(10n+4) .bg-col-inner{ animation-duration: 21s; animation-direction: reverse; }
  .bg-col:nth-child(10n+5) .bg-col-inner{ animation-duration: 28s; }
  .bg-col:nth-child(10n+6) .bg-col-inner{ animation-duration: 17s; animation-direction: reverse; }
  .bg-col:nth-child(10n+7) .bg-col-inner{ animation-duration: 33s; }
  .bg-col:nth-child(10n+8) .bg-col-inner{ animation-duration: 20s; animation-direction: reverse; }
  .bg-col:nth-child(10n+9) .bg-col-inner{ animation-duration: 24s; }
  .bg-col:nth-child(10n+0) .bg-col-inner{ animation-duration: 18s; animation-direction: reverse; }
  .bg-col-inner.turbo{ animation-duration: 0.18s !important; filter: brightness(1.7) saturate(1.5) blur(2.5px); }

  .bg-line{
    font-size: clamp(10px, 0.95vw, 14px);
    font-weight: 700;
    padding: 4px 8px;
    white-space: nowrap;
    color: var(--green);
    opacity: 0.75;
    text-shadow: 0 0 6px rgba(51,255,156,0.6);
    letter-spacing: 0.01em;
  }
  .bg-line.brand{ color: var(--purple); text-shadow: 0 0 14px rgba(199,125,255,0.85); }
  .bg-line.self{ color: var(--red); text-shadow: 0 0 14px rgba(255,76,76,0.75); }
  .bg-line.done{ color: rgba(51,255,156,0.4); text-shadow: none; }

  .bg-dim{
    position: fixed; inset: 0; z-index: 1; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0.15) 0%, rgba(0,0,0,0.6) 68%, rgba(0,0,0,0.88) 100%);
  }

  /* ---------- minimal corner controls ---------- */
  .corner-btn-group{
    position: fixed; top: 18px; right: 18px; z-index: 20;
    display: flex; gap: 10px;
  }
  .corner-btn{
    background: rgba(0,0,0,0.7); border: 2px solid var(--green); color: var(--green);
    font-family: inherit; font-size: 13px; font-weight: 700; letter-spacing: 0.05em;
    padding: 10px 18px; cursor: pointer; text-shadow: 0 0 5px rgba(51,255,156,0.6);
  }
  .corner-btn:hover{ background: rgba(51,255,156,0.12); }
  .corner-btn.full-reset{
    border-color: var(--red); color: var(--red); text-shadow: 0 0 5px rgba(255,76,76,0.6);
  }
  .corner-btn.full-reset:hover{ background: rgba(255,76,76,0.12); }
  .counter-fixed{
    position: fixed; top: 18px; left: 18px; z-index: 20;
    font-size: 13px; font-weight: 700; color: var(--green);
    background: rgba(0,0,0,0.7); border: 2px solid rgba(51,255,156,0.4); padding: 9px 14px;
    text-shadow: 0 0 4px rgba(51,255,156,0.5);
    display: flex; flex-direction: column; gap: 4px; line-height: 1.4;
  }
  .counter-fixed .line{ white-space: nowrap; }
  .counter-fixed .line.self-line{ color: var(--red); text-shadow: 0 0 4px rgba(255,76,76,0.5); }
  .counter-fixed .line b{ font-weight: 900; }

  /* ---------- import modal ---------- */
  .roster-modal{
    position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; padding: 20px;
  }
  .roster-modal.show{ display: flex; }
  .roster-modal-inner{
    width: min(92vw, 480px); max-height: 86vh; overflow-y: auto;
    background: var(--panel-bg); border: 3px solid var(--green); padding: 22px;
  }
  .roster-modal-inner label{ display:block; font-size: 12px; font-weight: 700; color: var(--green); margin: 12px 0 6px; letter-spacing: 0.04em; }
  .roster-modal-inner label:first-of-type{ margin-top: 0; }
  .roster-modal-inner label.self-label{ color: var(--red); }
  .roster-modal-inner textarea{
    width: 100%; min-height: 130px; resize: vertical; border: 2px solid var(--green-dim);
    background: #04100A; color: var(--ink-light); padding: 9px; font-size: 12.5px; line-height: 1.6; font-family: inherit;
  }
  #selfInput{ min-height: 80px; border-color: rgba(255,76,76,0.5); }
  .modal-actions{ display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button{
    flex: 1; padding: 10px 0; font-family: inherit; font-size: 12.5px; font-weight: 700; cursor: pointer;
    border: 2px solid var(--green); background: rgba(51,255,156,0.08); color: var(--green);
  }
  .modal-actions .btn-close-modal{ border-color: rgba(234,251,241,0.35); color: rgba(234,251,241,0.75); background: transparent; }
  .roster-preview{ margin-top: 14px; max-height: 140px; overflow-y: auto; border-top: 1px dashed rgba(51,255,156,0.25); padding-top: 8px; }
  .roster-preview .entry{ display:flex; align-items:center; gap:8px; font-size: 11px; padding: 3px 0; color: var(--ink-light); }
  .roster-preview .entry.drawn{ color: rgba(234,251,241,0.35); text-decoration: line-through; }
  .roster-preview .self-flag{ color: var(--red); font-size: 10px; }

  .excel-divider{
    display:flex; align-items:center; gap:10px; margin: 16px 0 12px;
    font-size: 11px; color: rgba(234,251,241,0.45); letter-spacing: 0.05em;
  }
  .excel-divider::before, .excel-divider::after{ content:""; flex:1; height:1px; background: rgba(234,251,241,0.2); }
  .excel-upload{
    border: 2px dashed var(--green-dim); padding: 14px; text-align:center; font-size: 11.5px;
    color: rgba(234,251,241,0.7); line-height:1.7;
  }
  .excel-upload input[type=file]{
    display:block; margin: 8px auto 0; font-size: 11px; color: var(--ink-light); font-family: inherit;
  }

  /* ---------- center stage: teacher + hand-controlled button panel ---------- */
  .center-stage{
    position: relative; z-index: 2; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 22px; padding: 100px 30px 30px;
  }
  .stage-row{
    display: flex; flex-direction: row; align-items: center; justify-content: center;
    gap: 32px; flex-wrap: wrap; width: 100%;
  }
  .assign-bar{
    display: flex; align-items: center; justify-content: center; gap: 10px; flex-wrap: wrap;
    width: min(92vw, 820px); position: relative;
  }
  .assign-bar input[type=text]{
    flex: 1 1 220px; min-width: 160px; background: rgba(0,0,0,0.55);
    border: 2px solid rgba(51,255,156,0.4); color: var(--green);
    font-family: inherit; font-size: 14px; padding: 10px 12px; outline: none;
    text-shadow: 0 0 4px rgba(51,255,156,0.4);
  }
  .assign-bar input[type=text]::placeholder{ color: rgba(234,251,241,0.35); }
  .assign-bar input[type=text]:focus{ border-color: var(--green); box-shadow: 0 0 14px rgba(51,255,156,0.3); }
  .assign-bar button{
    background: rgba(51,255,156,0.12); border: 2px solid var(--green); color: var(--green);
    font-family: inherit; font-weight:700; font-size: 13px; padding: 10px 18px; cursor:pointer;
    text-shadow: 0 0 5px rgba(51,255,156,0.6); white-space: nowrap;
  }
  .assign-bar button:hover{ background: rgba(51,255,156,0.22); }
  .assign-msg{
    position:absolute; left:50%; bottom:-24px; transform: translateX(-50%);
    font-size: 12px; font-weight:700; color: var(--red); opacity:0; white-space:nowrap;
    transition: opacity 0.2s linear;
  }
  .assign-msg.show{ opacity:1; }

  .teacher-portrait{
    width: min(44vw, 820px); aspect-ratio: 4/3; position: relative;
    border: 3px solid var(--green); box-shadow: 0 0 26px rgba(51,255,156,0.25); overflow: hidden;
  }
  .teacher-portrait img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering: pixelated; }
  .teacher-portrait .glow-img{ opacity: 0; transition: opacity 0.15s linear; }
  .teacher-portrait.forced-glow .glow-img{ opacity: 1; }

  .hand-panel-wrap{ position: relative; }
  .hand-panel{
    position: relative; width: min(44vw, 820px); aspect-ratio: 700/518;
    border: 4px solid var(--green); box-shadow: 0 0 24px rgba(51,255,156,0.25);
    overflow: hidden; cursor: none;
  }
  .hand-panel.disabled{ cursor: not-allowed; filter: grayscale(0.75) brightness(0.6); pointer-events: none; }
  .hand-panel img.panel-bg{ position:absolute; inset:0; width:100%; height:100%; object-fit:fill; image-rendering:pixelated; user-select:none; pointer-events:none; }
  .hotspot{
    position:absolute; width:27%; aspect-ratio:1; border-radius:50%; transform: translate(-50%,-50%);
    background: transparent; transition: background 0.1s linear, box-shadow 0.1s linear; cursor:none;
  }
  .hotspot:hover{ background: rgba(255,255,255,0.14); box-shadow: 0 0 30px rgba(255,255,255,0.35); }
  .hotspot-self{ left:32.5%; top:47.8%; }
  .hotspot-random{ left:67.4%; top:36.4%; }
  .hand-cursor-el{
    position:absolute; width:34%; top:0; left:0; transform: translate(-32%,-14%);
    pointer-events:none; opacity:0; filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.45));
    transition: opacity 0.1s linear; z-index:5; image-rendering: pixelated;
  }
  .hand-panel:hover .hand-cursor-el{ opacity:1; }

  @media (max-width: 900px){
    .stage-row{ flex-direction: column; gap: 20px; }
    .teacher-portrait, .hand-panel{ width: min(82vw, 480px); }
  }

  .pool-msg{
    position:absolute; left:50%; bottom:-30px; transform: translateX(-50%);
    font-size: 12px; font-weight:700; color: var(--red); opacity:0; white-space:nowrap;
    transition: opacity 0.2s linear;
  }
  .pool-msg.show{ opacity:1; }

  .btn-reset{
    background: none; border: none; font-family: inherit; font-size: 12px;
    color: rgba(234,251,241,0.45); text-decoration: underline; cursor: pointer;
  }

  /* ---------- result popup ---------- */
  .result-overlay{
    position: fixed; inset: 0; z-index: 999; background: rgba(0,0,0,0.55);
    display:none; align-items:center; justify-content:center; opacity:0;
    transition: opacity 0.25s linear;
  }
  .result-overlay.show{ display:flex; opacity:1; }
  .result-card{
    width: min(80vw, 640px); background: var(--panel-bg); border: 4px solid var(--green);
    box-shadow: 0 0 40px rgba(51,255,156,0.4); padding: 48px 40px; text-align:center;
    transform: scale(0.85); transition: transform 0.25s cubic-bezier(.34,1.56,.64,1);
  }
  .result-overlay.show .result-card{ transform: scale(1); }
  .result-card.self{ border-color: var(--red); box-shadow: 0 0 40px rgba(255,76,76,0.4); }
  .result-tag{
    display:inline-block; font-size: 14px; font-weight:700; letter-spacing:0.14em; color:#000;
    background: var(--green); padding: 5px 16px; margin-bottom: 18px;
  }
  .result-card.self .result-tag{ background: var(--red); color:#fff; }
  .result-name{
    font-size: clamp(32px, 5vw, 56px); font-weight: 700; color: var(--ink-light);
    text-shadow: 0 0 16px rgba(234,251,241,0.5); line-height:1.25; word-break: break-word;
  }
  .result-actions{ margin-top: 30px; display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .result-actions button{
    padding: 14px 30px; font-family: inherit; font-size: 14px; font-weight:700; cursor:pointer;
    border: 2px solid var(--purple); background: rgba(199,125,255,0.1); color: var(--purple);
    text-shadow: 0 0 4px rgba(199,125,255,0.5);
  }
  .result-actions button:hover{ background: rgba(199,125,255,0.25); }
  .result-actions button:disabled{ opacity:0.35; cursor:not-allowed; }
  .result-actions .btn-dismiss{ border-color: rgba(234,251,241,0.35); color: rgba(234,251,241,0.8); background:transparent; text-shadow:none; }

  .flash-pulse{
    position: fixed; inset:0; z-index: 998; background: var(--green); opacity:0; pointer-events:none;
  }
  .flash-pulse.pop{ animation: fp 0.3s ease-out; }
  @keyframes fp{ 0%{ opacity:0.55; } 100%{ opacity:0; } }

  /* ---------- self-recommend hero reveal: diagonal comic panels ---------- */
  .hero-overlay{
    position: fixed; inset: 0; z-index: 998; background: #000;
    opacity: 0; visibility: hidden; pointer-events: none;
    transition: opacity 0.25s linear;
  }
  .hero-overlay.active{ opacity: 1; visibility: visible; }
  .hero-continue-hint{
    position: absolute; left: 50%; bottom: 6%; transform: translateX(-50%);
    z-index: 999; color: #fff; font-family: "Microsoft JhengHei", sans-serif;
    font-weight: 900; font-size: clamp(16px, 3vw, 26px); letter-spacing: 0.05em;
    text-shadow: 0 0 8px rgba(51,255,156,0.9), 0 0 16px rgba(51,255,156,0.6);
    opacity: 0; visibility: hidden; pointer-events: none; transition: opacity 0.3s ease;
  }
  .hero-overlay.ready .hero-continue-hint{
    opacity: 1; visibility: visible; pointer-events: auto;
    animation: heroHintPulse 1.1s ease-in-out infinite;
  }
  .hero-overlay.ready{ cursor: pointer; pointer-events: auto; }
  @keyframes heroHintPulse{
    0%, 100%{ opacity: 0.55; transform: translateX(-50%) scale(1); }
    50%{ opacity: 1; transform: translateX(-50%) scale(1.06); }
  }
  .hero-stage{
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: min(94vw, 1000px); aspect-ratio: 16/9;
  }
  .hero-panel{ position: absolute; top: 0; bottom: 0; overflow: hidden; }
  .hero-panel .hfill{ position: absolute; inset: -2px; }
  .hero-panel .hshutter{
    position: absolute; inset: -2px; background: #000;
    transform: translateX(0%); transition: transform 0.4s steps(10, end);
  }
  .hero-overlay.active .hero-panel .hshutter{ transform: translateX(105%); }

  /* each panel owns just its own slice of the stage, so images crop to THAT box, not the whole stage */
  .hp1{ left: 0; width: 42%; clip-path: polygon(0 0, 100% 0, 81% 100%, 0 100%); }
  .hp1 .hshutter{ transition-delay: 0s; }
  .hp2{ left: 34%; width: 30%; clip-path: polygon(27% 0, 100% 0, 73% 100%, 0 100%); }
  .hp2 .hshutter{ transition-delay: 0.55s; }
  .hp3{ left: 56%; width: 44%; clip-path: polygon(18% 0, 100% 0, 100% 100%, 0 100%); }
  .hp3 .hshutter{ transition-delay: 1.1s; }

  .hero-panel img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position: center 15%; }
  .hp2 .hfill{ background:#111; display:flex; align-items:center; justify-content:center; }

  .speech-bubble{
    position: relative; width: 74%; max-width: 210px; background: #fff; color:#000; border: 4px solid #000;
    border-radius: 18px; padding: 10px 8px; text-align:center; word-break: break-word; box-sizing: border-box;
    font-family: Impact, "Arial Black", "Microsoft JhengHei", sans-serif;
    font-weight: 900; font-size: clamp(20px, 4.6vw, 34px); line-height: 1.15;
    letter-spacing: 0.02em; transform: rotate(-4deg) scale(0.85);
    -webkit-text-stroke: 3px #fff; paint-order: stroke fill;
    text-shadow: -2px -2px 0 #fff, 2px -2px 0 #fff, -2px 2px 0 #fff, 2px 2px 0 #fff,
                 0 -2px 0 #fff, 0 2px 0 #fff, -2px 0 0 #fff, 2px 0 0 #fff;
    box-shadow: 6px 6px 0 rgba(0,0,0,0.6);
    animation: bubblePop 0.35s steps(6) 0.6s both;
  }
  .speech-bubble.len-mid{ font-size: clamp(16px, 3.4vw, 24px); }
  .speech-bubble.len-long{ font-size: clamp(13px, 2.6vw, 18px); }
  @keyframes bubblePop{
    0%{ transform: rotate(-4deg) scale(0.4); }
    60%{ transform: rotate(-4deg) scale(1.15); }
    100%{ transform: rotate(-4deg) scale(1); }
  }
  .speech-bubble::after{
    content:""; position:absolute; left:50%; bottom:-18px; transform: translateX(-50%) rotate(-4deg);
    border-width: 18px 11px 0 11px; border-style: solid; border-color: #000 transparent transparent transparent;
  }
  .speech-bubble::before{
    content:""; position:absolute; left:50%; bottom:-12px; transform: translateX(-50%) rotate(-4deg);
    border-width: 14px 9px 0 9px; border-style: solid; border-color: #fff transparent transparent transparent;
    z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    .hero-panel .hshutter, .hero-overlay, .bg-col-inner, .result-overlay, .result-card{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

  <div class="bg-scroll" id="bgScroll">
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
    <div class="bg-col"><div class="bg-col-inner"></div></div>
  </div>
  <div class="bg-dim"></div>
  <div class="flash-pulse" id="flashPulse"></div>

  <div class="counter-fixed" id="counter">尚未匯入</div>
  <div class="corner-btn-group">
    <button class="corner-btn full-reset" id="fullResetBtn">全部重置</button>
    <button class="corner-btn" id="rosterToggleBtn">名單</button>
  </div>

  <div class="roster-modal" id="rosterModal">
    <div class="roster-modal-inner">
      <label>全班名單</label>
      <textarea id="rosterInput" placeholder="王小明, https://linkedin.com/in/xxxx"></textarea>
      <label class="self-label">自我推薦名單（人數較少，僅姓名或姓名,網址）</label>
      <textarea id="selfInput" placeholder="陳小美"></textarea>
      <div class="modal-actions">
        <button id="importBtn">匯入</button>
        <button class="btn-close-modal" id="closeRosterModal">關閉</button>
      </div>

      <div class="excel-divider">或上傳 Excel</div>
      <div class="excel-upload">
        欄位依序為：姓名／LinkedIn 網址／是否自薦（是、Y、1、✓ 皆可）
        <input type="file" id="excelFile" accept=".xlsx,.xls,.csv">
      </div>

      <div class="roster-preview" id="rosterList"></div>
    </div>
  </div>

  <div class="center-stage">

<script>
  let roster = []; // {name, url, drawn, method: null|'random'|'self', selfPool: bool}
  let drawCount = 0;

  /* ---------- cloud sync (Firebase Firestore) ----------
     老師在家匯入名單後會自動存到雲端；學校端開啟網頁時會自動讀取最新名單。
     若裝置離線或 Firebase 連不上，工具仍可正常在本機運作，只是不會同步。 */
  const firebaseConfig = {
    apiKey: "AIzaSyAuNN_weox2rcjfEjzxqIciISpuPNAyUqg",
    authDomain: "linkedin-draw.firebaseapp.com",
    projectId: "linkedin-draw",
    storageBucket: "linkedin-draw.firebasestorage.app",
    messagingSenderId: "279561736279",
    appId: "1:279561736279:web:186bc5261e9849e2de5312"
  };

  let rosterDocRef = null;
  try {
    if (window.firebase && firebase.initializeApp) {
      firebase.initializeApp(firebaseConfig);
      rosterDocRef = firebase.firestore().collection('rosters').doc('main');
    }
  } catch (err) {
    console.error('Firebase 初始化失敗，將只使用本機資料。', err);
    rosterDocRef = null;
  }

  function saveRosterToCloud(){
    if (!rosterDocRef) return;
    const payload = roster.map(e => ({
      name: e.name,
      url: e.url || '',
      drawn: !!e.drawn,
      method: e.method || null,
      selfPool: !!e.selfPool
    }));
    rosterDocRef.set({
      list: payload,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }).catch(err => console.error('雲端名單儲存失敗', err));
  }

  async function loadRosterFromCloud(){
    if (!rosterDocRef) return;
    try {
      const snap = await rosterDocRef.get();
      if (!snap.exists) return;
      const data = snap.data();
      if (!Array.isArray(data.list) || data.list.length === 0) return;
      roster = data.list.map(e => ({
        name: e.name,
        url: e.url || '',
        drawn: !!e.drawn,
        method: e.method || null,
        selfPool: !!e.selfPool
      }));
      drawCount = roster.filter(e => e.drawn).length;
      renderRosterList();
      updateCounter();
      refreshPanelState();
      refreshAssignList();
      renderBgColumns();
      if (roster.length > 0 && !roster.some(e => !e.drawn)){
        resetBtn.style.display = 'inline-block';
      }
    } catch (err) {
      console.error('雲端名單讀取失敗，將顯示本機資料。', err);
    }
  }

  const rosterModal = document.getElementById('rosterModal');
  const closeRosterModal = document.getElementById('closeRosterModal');
  const rosterInput = document.getElementById('rosterInput');
  const selfInput = document.getElementById('selfInput');
  const importBtn = document.getElementById('importBtn');
  const rosterList = document.getElementById('rosterList');
  const counter = document.getElementById('counter');

  const handPanel = document.getElementById('handPanel');
  const handCursorEl = document.getElementById('handCursorEl');
  const hotspotSelf = document.getElementById('hotspotSelf');
  const hotspotRandom = document.getElementById('hotspotRandom');
  const poolMsg = document.getElementById('poolMsg');
  const resetBtn = document.getElementById('resetBtn');
  const fullResetBtn = document.getElementById('fullResetBtn');
  const assignInput = document.getElementById('assignInput');
  const assignBtn = document.getElementById('assignBtn');
  const assignMsg = document.getElementById('assignMsg');
  const assignNameList = document.getElementById('assignNameList');

  const resultOverlay = document.getElementById('resultOverlay');
  const heroOverlay = document.getElementById('heroOverlay');
  const heroBubbleText = document.getElementById('heroBubbleText');
  const heroImgTouch = document.getElementById('heroImgTouch');
  const heroImgPoint = document.getElementById('heroImgPoint');
  heroImgTouch.dataset.selfSrc = heroImgTouch.src;
  heroImgPoint.dataset.selfSrc = heroImgPoint.src;
  const SELF_PHRASES = ['{name}，你很勇喔', '{name}是個狠人', '{name}勇者', '{name}你太狂了！', '{name}你是全村的希望！'];
  const RANDOM_PHRASES = ['{name}就決定是你了！', '上吧！{name}'];
  const resultCard = document.getElementById('resultCard');
  const resultTag = document.getElementById('resultTag');
  const resultName = document.getElementById('resultName');
  const resultOpenBtn = document.getElementById('resultOpenBtn');
  const resultDismiss = document.getElementById('resultDismiss');
  const flashPulse = document.getElementById('flashPulse');

  let currentPick = null;
  let isDrawing = false; // 過場/開獎動畫進行中時鎖住，避免誤觸重複抽籤

  const PLACEHOLDER_BG = ['TNDA 數位創意創業思維','SYNAPSE STANDBY','WAITING FOR ROSTER','點右上角「名單」匯入','TNDA 數位創意創業思維','SYSTEM READY'];

  const teacherPortrait = document.getElementById('teacherPortrait');

  handPanel.addEventListener('mousemove', (e) => {
    const rect = handPanel.getBoundingClientRect();
    handCursorEl.style.left = (e.clientX - rect.left) + 'px';
    handCursorEl.style.top = (e.clientY - rect.top) + 'px';
  });
  [hotspotSelf, hotspotRandom].forEach(hs => {
    hs.addEventListener('mouseenter', () => { teacherPortrait.classList.add('forced-glow'); });
    hs.addEventListener('mouseleave', () => { teacherPortrait.classList.remove('forced-glow'); });
  });

  function currentBgItems(){
    if (roster.length === 0) return PLACEHOLDER_BG;
    const items = [];
    roster.forEach((e, i) => {
      let label = e.name;
      if (e.drawn && e.method === 'self') label += '　自薦';
      else if (e.drawn && e.method === 'random') label += '　已抽';
      else if (e.selfPool) label += '　★';
      items.push(label);
      if ((i + 1) % 4 === 0) items.push('TNDA 數位創意創業思維');
    });
    if (items.indexOf('TNDA 數位創意創業思維') === -1) items.push('TNDA 數位創意創業思維');
    const MIN_ITEMS = 90; // enough lines that duplicated content always exceeds full screen height
    while (items.length < MIN_ITEMS){ items.push(...items.slice(0, Math.max(1, MIN_ITEMS - items.length))); }
    return items;
  }

  function renderBgColumns(){
    const items = currentBgItems();
    const cols = document.querySelectorAll('.bg-col-inner');
    cols.forEach((col, ci) => {
      const offset = ci % items.length;
      const rotated = items.slice(offset).concat(items.slice(0, offset));
      const html = rotated.map(t => {
        let cls = 'bg-line';
        if (t.indexOf('TNDA') !== -1) cls += ' brand';
        else if (t.indexOf('自薦') !== -1) cls += ' self';
        else if (t.indexOf('已抽') !== -1) cls += ' done';
        return '<div class="' + cls + '">' + t + '</div>';
      }).join('');
      col.innerHTML = html + html;
    });
  }

  rosterToggleBtn.addEventListener('click', () => { rosterModal.classList.add('show'); });
  closeRosterModal.addEventListener('click', () => { rosterModal.classList.remove('show'); });

  function normalizeUrl(u){
    if (!u) return '';
    const trimmed = u.trim();
    if (!trimmed) return '';
    if (/^https?:\/\//i.test(trimmed)) return trimmed;
    return 'https://' + trimmed.replace(/^\/+/, '');
  }

  function parseLines(text){
    return text.split('\n')
      .map(l => l.trim())
      .filter(l => l.length > 0)
      .map(l => {
        const normalized = l.replace(/[，、；]/g, ',');
        let name, url;
        if (normalized.indexOf(',') !== -1){
          const parts = normalized.split(',');
          name = parts[0].trim();
          url = parts.slice(1).join(',').trim();
        } else {
          const m = normalized.match(/https?:\/\/\S+/i);
          if (m){
            url = m[0];
            name = (normalized.slice(0, m.index) + normalized.slice(m.index + m[0].length)).trim();
          } else {
            name = normalized;
            url = '';
          }
        }
        name = name.replace(/^[,\s]+|[,\s]+$/g, '');
        return { name, url: normalizeUrl(url) };
      })
      .filter(e => e.name);
  }

  function renderRosterList(){
    rosterList.innerHTML = '';
    roster.forEach(e => {
      const div = document.createElement('div');
      div.className = 'entry' + (e.drawn ? ' drawn' : '');
      div.innerHTML = '<span>' + e.name + '</span>' + (e.selfPool ? '<span class="self-flag">★自薦</span>' : '');
      rosterList.appendChild(div);
    });
  }

  function updateCounter(){
    if (roster.length === 0){ counter.textContent = '尚未匯入'; return; }
    const randomTotal = roster.length;
    const randomRemaining = roster.filter(e => !e.drawn).length;
    const selfEntries = roster.filter(e => e.selfPool);
    const selfTotal = selfEntries.length;
    const selfRemaining = selfEntries.filter(e => !e.drawn).length;
    counter.innerHTML =
      '<span class="line">隨機：剩 <b>' + randomRemaining + '</b> / 共 ' + randomTotal + '</span>' +
      '<span class="line self-line">自薦：剩 <b>' + selfRemaining + '</b> / 共 ' + selfTotal + '</span>';
  }

  function refreshPanelState(){
    const anyRemaining = roster.some(e => !e.drawn);
    handPanel.classList.toggle('disabled', !anyRemaining);
  }

  importBtn.addEventListener('click', () => {
    const mainParsed = parseLines(rosterInput.value);
    if (mainParsed.length === 0){
      alert('請至少輸入一位同學的姓名與網址。');
      return;
    }
    const selfParsed = parseLines(selfInput.value);

    roster = mainParsed.map(p => ({ name: p.name, url: p.url, drawn: false, method: null, selfPool: false }));

    selfParsed.forEach(sp => {
      const match = roster.find(r => r.name === sp.name);
      if (match){
        match.selfPool = true;
        if (!match.url && sp.url) match.url = sp.url;
      } else {
        roster.push({ name: sp.name, url: sp.url, drawn: false, method: null, selfPool: true });
      }
    });

    drawCount = 0;
    resetBtn.style.display = 'none';
    renderRosterList();
    updateCounter();
    refreshPanelState();
    refreshAssignList();
    saveRosterToCloud();
    renderBgColumns();
    rosterModal.classList.remove('show');
  });

  function showPoolMsg(){
    poolMsg.classList.add('show');
    setTimeout(() => poolMsg.classList.remove('show'), 1600);
  }

  function commitPick(idx, method){
    isDrawing = true;
    const alreadyDrawn = roster[idx].drawn;
    roster[idx].drawn = true;
    roster[idx].method = method;
    currentPick = roster[idx];
    if (!alreadyDrawn) drawCount++;

    renderRosterList();
    updateCounter();
    refreshPanelState();
    refreshAssignList();
    saveRosterToCloud();
    renderBgColumns();

    runTransition(currentPick);

    if (!roster.some(e => !e.drawn)){
      resetBtn.style.display = 'inline-block';
    }
  }

  function runTransition(entry){
    document.querySelectorAll('.bg-col-inner').forEach(el => el.classList.add('turbo'));
    setTimeout(() => {
      document.querySelectorAll('.bg-col-inner').forEach(el => el.classList.remove('turbo'));
      flashPulse.classList.remove('pop');
      void flashPulse.offsetWidth;
      flashPulse.classList.add('pop');
      playHeroSequence(entry);
    }, 550);
  }

  function playHeroSequence(entry){
    const isSelf = entry.method === 'self';
    const phraseList = isSelf ? SELF_PHRASES : RANDOM_PHRASES;
    const phrase = phraseList[Math.floor(Math.random() * phraseList.length)];
    const finalText = phrase.replace('{name}', entry.name);
    heroBubbleText.textContent = finalText;
    heroBubbleText.classList.remove('len-mid', 'len-long');
    if (finalText.length > 9) {
      heroBubbleText.classList.add('len-long');
    } else if (finalText.length > 5) {
      heroBubbleText.classList.add('len-mid');
    }

    heroImgTouch.src = isSelf ? heroImgTouch.dataset.selfSrc : heroImgTouch.dataset.randomSrc;
    heroImgPoint.src = isSelf ? heroImgPoint.dataset.selfSrc : heroImgPoint.dataset.randomSrc;

    const shutters = heroOverlay.querySelectorAll('.hshutter');
    heroOverlay.classList.remove('active');
    shutters.forEach(el => { el.style.transition = 'none'; });
    void heroOverlay.offsetWidth;
    shutters.forEach(el => { el.style.transition = ''; });

    requestAnimationFrame(() => { heroOverlay.classList.add('active'); });

    heroOverlay.classList.remove('ready');
    setTimeout(() => {
      heroOverlay.classList.add('ready');
    }, 1900);

    heroOverlay.onclick = () => {
      if (!heroOverlay.classList.contains('ready')) return;
      heroOverlay.classList.remove('active', 'ready');
      heroOverlay.onclick = null;
      showResult(entry);
    };
  }

  function showResult(entry){
    isDrawing = false;
    resultTag.textContent = entry.method === 'self' ? '自我推薦' : '抽到了';
    resultCard.classList.toggle('self', entry.method === 'self');
    resultName.textContent = entry.name;
    resultOpenBtn.disabled = !entry.url;
    resultOverlay.classList.add('show');
  }

  resultOpenBtn.addEventListener('click', () => {
    if (currentPick && currentPick.url) window.open(normalizeUrl(currentPick.url), '_blank');
  });
  resultDismiss.addEventListener('click', () => { resultOverlay.classList.remove('show'); });

  hotspotRandom.addEventListener('click', () => {
    if (isDrawing) return;
    const pool = roster.map((e,i) => i).filter(i => !roster[i].drawn);
    if (pool.length === 0) return;
    const idx = pool[Math.floor(Math.random() * pool.length)];
    commitPick(idx, 'random');
  });

  hotspotSelf.addEventListener('click', () => {
    if (isDrawing) return;
    const pool = roster.map((e,i) => i).filter(i => !roster[i].drawn && roster[i].selfPool);
    if (pool.length === 0){ showPoolMsg(); return; }
    const idx = pool[Math.floor(Math.random() * pool.length)];
    commitPick(idx, 'self');
  });

  function refreshAssignList(){
    assignNameList.innerHTML = '';
    roster.forEach(e => {
      const opt = document.createElement('option');
      opt.value = e.name;
      assignNameList.appendChild(opt);
    });
  }

  function showAssignMsg(text){
    assignMsg.textContent = text;
    assignMsg.classList.remove('show');
    void assignMsg.offsetWidth;
    assignMsg.classList.add('show');
    setTimeout(() => assignMsg.classList.remove('show'), 1800);
  }

  function commitAssign(){
    if (isDrawing) return;
    const name = assignInput.value.trim();
    if (!name){
      showAssignMsg('請輸入姓名');
      return;
    }
    if (roster.length === 0){
      showAssignMsg('尚未匯入名單');
      return;
    }
    const idx = roster.findIndex(e => e.name === name);
    if (idx === -1){
      showAssignMsg('查無此姓名');
      return;
    }
    assignInput.value = '';
    commitPick(idx, 'self');
  }

  assignBtn.addEventListener('click', commitAssign);
  assignInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter'){
      e.preventDefault();
      commitAssign();
    }
  });

  const excelFile = document.getElementById('excelFile');

  function parseExcelRows(rows){
    if (!rows || rows.length === 0) return [];
    let startIdx = 0;
    let nameCol = 0, urlCol = 1, selfCol = 2;

    const header = (rows[0] || []).map(c => (c === undefined || c === null) ? '' : c.toString());
    const looksLikeHeader = header.some(h => /名|name/i.test(h)) && header.some(h => /linkedin|網址|url/i.test(h));
    if (looksLikeHeader){
      startIdx = 1;
      header.forEach((h, i) => {
        if (/名/.test(h) || /name/i.test(h)) nameCol = i;
        else if (/linkedin|網址|url/i.test(h)) urlCol = i;
        else if (/自薦|推薦/.test(h)) selfCol = i;
      });
    }

    const out = [];
    for (let i = startIdx; i < rows.length; i++){
      const row = rows[i];
      if (!row) continue;
      const rawName = row[nameCol];
      const name = (rawName === undefined || rawName === null) ? '' : rawName.toString().trim();
      if (!name) continue;
      const rawUrl = row[urlCol];
      const url = normalizeUrl((rawUrl === undefined || rawUrl === null) ? '' : rawUrl.toString().trim());
      const rawSelf = row[selfCol];
      const selfText = (rawSelf === undefined || rawSelf === null) ? '' : rawSelf.toString().trim();
      const isSelf = /^(是|y|yes|true|1|✓|v|對)$/i.test(selfText);
      out.push({ name, url, selfPool: isSelf });
    }
    return out;
  }

  excelFile.addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = (evt) => {
      try{
        const data = new Uint8Array(evt.target.result);
        const wb = XLSX.read(data, { type: 'array' });
        const sheet = wb.Sheets[wb.SheetNames[0]];
        const rows = XLSX.utils.sheet_to_json(sheet, { header: 1 });
        const parsed = parseExcelRows(rows);
        if (parsed.length === 0){
          alert('Excel 檔案沒有讀到有效資料，請確認欄位是姓名、LinkedIn 網址、是否自薦。');
          return;
        }
        roster = parsed.map(p => ({ name: p.name, url: p.url, drawn: false, method: null, selfPool: p.selfPool }));
        drawCount = 0;
        resetBtn.style.display = 'none';
        renderRosterList();
        updateCounter();
        refreshPanelState();
        refreshAssignList();
        saveRosterToCloud();
        renderBgColumns();
        rosterModal.classList.remove('show');
      } catch(err){
        alert('讀取 Excel 檔案失敗，請確認檔案格式正確。');
      }
      excelFile.value = '';
    };
    reader.readAsArrayBuffer(file);
  });

  function resetAllDraws(){
    isDrawing = false;
    roster.forEach(e => { e.drawn = false; e.method = null; });
    drawCount = 0;
    resetBtn.style.display = 'none';
    renderRosterList();
    updateCounter();
    refreshPanelState();
    refreshAssignList();
    saveRosterToCloud();
    renderBgColumns();
  }

  resetBtn.addEventListener('click', resetAllDraws);

  fullResetBtn.addEventListener('click', () => {
    if (roster.length === 0) return;
    const ok = confirm('確定要重置全部抽籤紀錄嗎？所有同學都會回到「尚未抽過」的狀態，此動作無法復原。');
    if (!ok) return;
    heroOverlay.classList.remove('active', 'ready');
    heroOverlay.onclick = null;
    resultOverlay.classList.remove('show');
    resetAllDraws();
  });

  renderBgColumns();
  loadRosterFromCloud();
</script>
</body>
</html>
